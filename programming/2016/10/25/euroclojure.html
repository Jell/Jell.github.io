<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jawaninja has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://reify.se/blog/2016-10-25-euroclojure">
<style>
  :root { --bg: #fbfbf7; --ink: #15151c; --muted: #5b5b66; --accent: #c6ff1a; --line: #7a5cff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111116; --ink: #f2f2ee; --muted: #a3a3ad; --line: #9a84ff; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; }
  main { text-align: center; max-width: 32rem; }
  h1 { font-size: 1.75rem; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
  p { color: var(--muted); margin: 0 0 1.75rem; }
  a.button { display: inline-block; background: var(--accent); color: #15151c; font-weight: 700;
             text-decoration: none; padding: 0.75rem 1.5rem; border-radius: 999px;
             border: 2px solid var(--line); }
  a.button:hover, a.button:focus-visible { background: var(--line); color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Jawaninja has moved</h1>
  <p>This post now lives on reify.se.</p>
  <a class="button" href="https://reify.se/blog/2016-10-25-euroclojure">Go to reify.se</a>
</main>
</body>
</html>
